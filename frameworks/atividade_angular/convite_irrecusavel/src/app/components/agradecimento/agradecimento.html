<div class="agradecimento-container">
  <div class="content">
    
    <!-- Meme brasileiro clássico -->
    <div class="meme">
      <h1>OBRIGADO POR ACEITAR!</h1>
      
      <div class="meme-content">
        <img [src]="'https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmRvMjJ4NWpqNmw4eXJ1Y3Mxb202cnAwOTFoZXR3YXZ5Y3czYmMxMCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/nKG86WRlokFfW/giphy.gif'" 
             alt="Celebração" class="meme-image">
        
        <div class="meme-text">
          <h2>AI SIM, MEU CONSAGRADO!</h2>
          <p>Você acaba de fazer a melhor escolha da sua vida!</p>
          
          <div class="details">
            <p>🍻 <strong>Traga:</strong> tira gosto e sua presença!</p>
            <p>🎵 <strong>Playlist:</strong> Só os clássicos</p>
            <p>💃 <strong>Prepara o passinho:</strong> O role promete!</p>
          </div>

          <div class="warning">
            <p>⚠️ <strong>AVISO IMPORTANTE:</strong></p>
            <p>Depois não adianta dizer que não foi avisado!</p>
          </div>
        </div>
      </div>

      <button class="btn-voltar" (click)="voltarParaConvite()">
        🔄 Fazer outro convite
      </button>
    </div>

  </div>
</div>
